version: '3.8'

services:
  defect-detection:
    build: .
    container_name: defect-detection
    ports:
      - "5000:5000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - APP_DEBUG=false
      - INFERENCE_DEVICE=cpu
    volumes:
      - ./runtime/uploads:/app/runtime/uploads
      - ./runtime/reports:/app/runtime/reports
      - ./runtime/cache:/app/runtime/cache
      - ./runtime/logs:/app/runtime/logs
      - ./models:/app/models
      - ./knowledge:/app/knowledge
    restart: unless-stopped